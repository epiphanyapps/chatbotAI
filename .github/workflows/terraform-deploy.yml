name: 'Terraform Infrastructure Deployment'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

# Least-privilege default for GITHUB_TOKEN. Individual jobs widen this only as
# needed (PR comments, SARIF upload).
permissions:
  contents: read

env:
  TF_VERSION: '1.6.0'
  # Terraform Cloud organization for the remote backend (set as a repo variable,
  # not a secret — the org name is not sensitive). Workspace is selected per-run
  # via TF_WORKSPACE below.
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    permissions:
      contents: read
      pull-requests: write  # post the plan as a PR comment

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init
      env:
        TF_WORKSPACE: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    - name: Terraform Validate
      run: terraform validate

    # NOTE: we deliberately do NOT use `-out=tfplan` + upload-artifact here.
    # A saved plan embeds resolved variable values (including secrets) in
    # cleartext regardless of `sensitive = true`; uploading it as an artifact
    # would expose every secret to anyone with Actions read access. State lives
    # in Terraform Cloud, so `apply` re-plans safely from the same locked state.
    - name: Terraform Plan
      id: plan
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          terraform plan -input=false -no-color -var-file="environments/production/terraform.tfvars"
        else
          terraform plan -input=false -no-color -var-file="environments/dev/terraform.tfvars"
        fi
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
        TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
        TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        TF_VAR_slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
        TF_WORKSPACE: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    - name: Comment PR with Plan
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        # Secret values are redacted by Terraform (all secret vars are
        # `sensitive = true`), so this plan text is safe to post.
        PLAN: ${{ steps.plan.outputs.stdout }}
      with:
        script: |
          const MAX = 60000; // keep under GitHub's comment size limit
          let plan = process.env.PLAN || '(no plan output)';
          if (plan.length > MAX) {
            plan = plan.slice(0, MAX) + '\n... (truncated — see the Plan job log for full output)';
          }
          const body = `## Terraform Plan 📋

          <details><summary>Show Plan</summary>

          \`\`\`
          ${plan}
          \`\`\`

          </details>

          *Environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}*
          `;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body,
          });

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    # Production applies are gated by the GitHub `production` Environment —
    # configure required reviewers there so a push to main does not deploy
    # unattended.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init
      env:
        TF_WORKSPACE: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    # Applies directly against the locked Terraform Cloud state (no cross-job
    # plan artifact). `apply` computes its own plan from the same state the plan
    # job validated, so secrets never touch a persisted file.
    - name: Terraform Apply
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          terraform apply -input=false -auto-approve -var-file="environments/production/terraform.tfvars"
        else
          terraform apply -input=false -auto-approve -var-file="environments/dev/terraform.tfvars"
        fi
      env:
        TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
        TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
        TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
        TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        TF_VAR_slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
        TF_WORKSPACE: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    - name: Output Infrastructure Info
      run: |
        echo "## 🚀 Infrastructure Deployed Successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Application URL:** $(terraform output -raw app_url)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**API Endpoint:** $(terraform output -raw api_url)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment Time:** $(date)" >> $GITHUB_STEP_SUMMARY
      env:
        TF_WORKSPACE: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

  terraform-security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Pinned to a release tag rather than @master (a moving ref is a
    # supply-chain risk). Pin to a full commit SHA for the strongest guarantee.
    - name: Run Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: terraform/
        framework: terraform
        output_format: sarif
        output_file_path: checkov-report.sarif
        soft_fail: true

    - name: Upload Checkov Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-report.sarif

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        working_directory: terraform/
        soft_fail: true

  notify-deployment:
    name: 'Notify Deployment'
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read

    steps:
    - name: Notify Slack on Success
      if: needs.terraform-apply.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        fields: repo,commit,author,ref,workflow
        text: |
          ✅ ChatbotAI infrastructure deployed successfully!

          Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

    - name: Notify Slack on Failure
      if: needs.terraform-apply.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        fields: repo,commit,author,ref,workflow
        text: |
          ❌ ChatbotAI infrastructure deployment failed!

          Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}

          Please check the GitHub Actions logs for details.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
